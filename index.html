<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>张嘉嘉的25岁生日礼物</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===================== -->
<!-- 🎬 1. 巨墙升起动画 -->
<!-- ===================== -->
<div id="wall-container">
    <img id="wall" src="https://i.imgur.com/5d3sD1H.jpeg" alt="Wall">
    <div id="click-hint">点击墙体开启惊喜</div>
</div>

<!-- ===================== -->
<!-- 💥 2. 裂开动画层 -->
<!-- ===================== -->
<div id="crack-layer" class="hidden">
    <img id="crack-img" src="https://i.imgur.com/1rp7hIg.png" />
</div>

<!-- ===================== -->
<!-- 📸 3. 彩蛋图片 + 上传入口 -->
<!-- ===================== -->
<div id="content" class="hidden">

    <h2 class="title">✨ 你的画开始呼吸了 ✨</h2>

    <div id="gallery">
        <img src="https://i.imgur.com/YNZqfTF.jpeg" class="art-img">
        <img src="https://i.imgur.com/sGaQw5M.jpeg" class="art-img">
        <img src="https://i.imgur.com/K5hd7lR.jpeg" class="art-img">
    </div>

    <div class="upload-section">
        <p>上传你的画 / 照片，让它也活过来：</p>
        <input type="file" id="imgUpload" accept="image/*">
    </div>

    <canvas id="artCanvas"></canvas>

    <!-- ===================== -->
    <!-- 🎵 背景音乐上传 -->
    <!-- ===================== -->
    <div class="upload-section">
        <p>上传你喜欢的背景音乐（mp3/wav）：</p>
        <input type="file" id="musicUpload" accept="audio/*">
        <button id="musicPlay">播放</button>
        <button id="musicPause">暂停</button>
    </div>

    <!-- ===================== -->
    <!-- 🎤 语音交互 -->
    <!-- ===================== -->
    <div id="voice-area">
        <p class="title">🎤 对我说说今天的心情吧</p>
        <button id="startVoice">开始录音</button>
        <div id="voiceText"></div>
        <button id="makeDiary">生成温柔治愈风日记</button>
        <div id="diaryOutput"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
