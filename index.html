<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>Memory Fragments · 梦境碎片回廊</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 星空背景 -->
<canvas id="starCanvas"></canvas>

<!-- 中心碎片 -->
<div id="memory-center">
    <canvas id="maskCanvas"></canvas>
    <img id="memory-img" src="images/p1.jpg">
</div>

<!-- 左右记忆碎片 -->
<div id="side-left" class="side-fragment"></div>
<div id="side-right" class="side-fragment"></div>

<!-- 麦克风 + 日记 -->
<div id="bottom-bar">
    <div id="mic-wrapper">
        <div id="mic-circle"></div>
        <div id="mic-icon">🎤</div>
    </div>
    <button id="saveDiary">Save Memory</button>
</div>

<!-- 日记区 -->
<div id="diary-panel">
    <textarea id="diaryText" placeholder="日记会写在这里..."></textarea>
</div>

<script src="script.js"></script>
</body>
</html>
