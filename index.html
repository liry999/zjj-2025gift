<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Memory Fragments · 星光梦境回廊</title>
    <link rel="stylesheet" href="style.css">

    <!-- 手写风字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=La+Belle+Aurore&display=swap" rel="stylesheet">
</head>
<body>

<!-- 🌓 1) 星空多层视差背景 -->
<div id="stars-layer1" class="stars"></div>
<div id="stars-layer2" class="stars"></div>
<div id="stars-layer3" class="stars"></div>

<!-- 🎤 麦克风 + API Key -->
<div id="top-controls">
    <button id="mic-btn">
        <div class="mic-circle"></div>
        <div class="mic-icon"></div>
    </button>

    <input id="apiKeyInput" placeholder="Enter OpenAI API Key to activate AI" />
</div>

<!-- 🌙 2) 中心记忆图像（不规则边缘 + 星光扩散） -->
<div id="memory-container">
    <canvas id="particleCanvas"></canvas>
    <img id="memory-img" src="images/p1.jpg">
</div>

<!-- ➡ ⬅ 左右切换 -->
<div id="left-nav"></div>
<div id="right-nav"></div>

<!-- 📖 3) 文学风对话显示 -->
<div id="dialogue-box"></div>

<!-- ✨ 4) Save Memory 按钮 -->
<div id="saveBtn">Save Memory</div>

<script src="script.js"></script>
</body>
</html>
