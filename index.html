<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>张嘉嘉的25岁梦境礼物 · Memory Fragments</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 🌌 深空背景视差 -->
<canvas id="starfield"></canvas>

<!-- 🌠 碎片粒子层 -->
<canvas id="particleCanvas"></canvas>

<!-- 📂 图片上传 -->
<input type="file" id="imgUpload" accept="image/*" multiple />

<!-- 🖼 梦境碎片容器 -->
<div id="memory-container">
    <canvas id="fragmentCanvas"></canvas>

    <!-- 🎤 麦克风按钮（SVG + 呼吸光圈） -->
    <div id="mic-wrapper">
        <div id="mic-pulse"></div>
        <svg id="mic-button" viewBox="0 0 24 24">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 14 0h-2zm-5 7c-3.31 0-6-2.69-6-6H5c0 4.08 3.05 7.44 7 7.93V22h2v-2.07c3.95-.49 7-3.85 7-7.93h-2c0 3.31-2.69 6-6 6z"/>
        </svg>
    </div>
</div>

<!-- 💬 对话与日记 -->
<div id="dialogue-panel">
    <div id="dialogue-log"></div>

    <textarea id="diaryText" placeholder="这里会生成你的梦境日记…"></textarea>

    <div id="saveRow">
        <button id="saveMemory">Save Memory</button>
    </div>
</div>

<!-- 🔑 OpenAI 访问 -->
<div id="apiBox">
    <input type="password" id="apiKeyInput" placeholder="输入 OpenAI API Key 启动梦境对话">
</div>

<script src="script.js"></script>
</body>
</html>
